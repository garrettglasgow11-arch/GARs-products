<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03000d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cosmicon">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Capture void beings, forge weapons, and conquer the abyss. A free browser RPG by GAR Productions.">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22COSMICON%20%E2%80%94%20Void%20Collector%22%2C%22short_name%22%3A%22Cosmicon%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%7D">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303000d'/%3E%3Cpolygon points='16,8 22,14 16,20 10,14' fill='%2300f5c4'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2303000d'/%3E%3Cpolygon points='90,50 130,90 90,130 50,90' fill='%2300f5c4'/%3E%3C/svg%3E">
<title>COSMICON — Void Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   COSMICON — VOID COLLECTOR  ·  INDEX
   ══════════════════════════════════════════════════════════════ */

:root {
  --void: #03000d;
  --purple: #8833ff;
  --violet: #bb55ff;
  --cyan: #00f5c4;
  --text: #e8d8ff;
  --dim: #5a4a88;
  --muted: #9888bb;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--void);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.title-logo {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(28px, 6vw, 64px);
  font-weight: 900;
  letter-spacing: clamp(4px, 1vw, 14px);
  margin-bottom: 20px;
  display: flex;
  gap: 1px;
  justify-content: center;
}

.letter {
  background: linear-gradient(175deg, #ffffff 0%, #ddb0ff 30%, var(--violet) 60%, var(--purple) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 14px rgba(170, 80, 255, 0.55));
  animation: lglow 3s ease-in-out infinite;
}

.letter:nth-child(2) { animation-delay: 0.08s; }
.letter:nth-child(3) { animation-delay: 0.16s; }
.letter:nth-child(4) { animation-delay: 0.24s; }
.letter:nth-child(5) { animation-delay: 0.32s; }
.letter:nth-child(6) { animation-delay: 0.40s; }
.letter:nth-child(7) { animation-delay: 0.48s; }
.letter:nth-child(8) { animation-delay: 0.56s; }

@keyframes lglow {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(170, 80, 255, 0.35)); }
  50% { filter: drop-shadow(0 0 24px rgba(210, 110, 255, 0.9)) brightness(1.18); }
}

.tagline {
  font-family: 'VT323', monospace;
  font-size: 13px;
  letter-spacing: 7px;
  color: var(--dim);
  margin-bottom: 10px;
}

.credit {
  font-family: 'VT323', monospace;
  font-size: 13px;
  letter-spacing: 3.5px;
  color: rgba(160, 120, 255, 0.45);
  margin-bottom: 40px;
}

.credit span {
  color: rgba(0, 245, 180, 0.75);
  letter-spacing: 3px;
  text-shadow: 0 0 12px rgba(0, 245, 180, 0.3);
}

.description {
  max-width: 600px;
  margin: 30px auto;
  font-size: 14px;
  line-height: 1.6;
  color: var(--muted);
}

.button-group {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 30px;
}

.btn {
  position: relative;
  overflow: hidden;
  background: rgba(5, 0, 18, 0.92);
  border: 1px solid rgba(130, 60, 255, 0.22);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 12px 24px;
  cursor: pointer;
  text-transform: uppercase;
  border-radius: 4px;
  transition: all 0.24s cubic-bezier(0.45, 0, 0.35, 1);
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--purple), rgba(100, 0, 200, 0.7));
  transform: translateX(-110%) skewX(-8deg);
  transition: transform 0.3s cubic-bezier(0.45, 0, 0.35, 1);
  z-index: 0;
}

.btn:hover::before {
  transform: translateX(0) skewX(0);
}

.btn:hover {
  border-color: var(--violet);
  box-shadow: 0 0 28px rgba(130, 40, 255, 0.5), inset 0 0 18px rgba(130, 40, 255, 0.12);
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.btn > * {
  position: relative;
  z-index: 1;
}

.btn-label {
  display: block;
  font-size: 13px;
  letter-spacing: 2px;
}

@media (max-width: 520px) {
  .title-logo {
    font-size: clamp(22px, 5vw, 42px);
    letter-spacing: clamp(2px, 0.5vw, 6px);
  }
  .button-group {
    gap: 8px;
  }
  .btn {
    font-size: 11px;
    padding: 10px 16px;
  }
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="container">
  <h1 class="title-logo">
    <span class="letter">C</span>
    <span class="letter">O</span>
    <span class="letter">S</span>
    <span class="letter">M</span>
    <span class="letter">I</span>
    <span class="letter">C</span>
    <span class="letter">O</span>
    <span class="letter">N</span>
  </h1>
  
  <p class="tagline">VOID COLLECTOR</p>
  <p class="credit">by <span>GAR Productions</span></p>
  
  <p class="description">
    Capture void beings, forge weapons, and conquer the abyss. A free browser RPG by GAR Productions.
  </p>
  
  <div class="button-group">
    <button class="btn">
      <span class="btn-label">Play Game</span>
    </button>
    <button class="btn">
      <span class="btn-label">Settings</span>
    </button>
    <button class="btn">
      <span class="btn-label">About</span>
    </button>
  </div>
</div>

<script>
// Initialize background canvas
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function drawBackground() {
  // Gradient background
  const gradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height));
  gradient.addColorStop(0, 'rgba(16, 0, 55, 0.2)');
  gradient.addColorStop(1, 'rgba(3, 0, 13, 1)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function animate() {
  drawBackground();
  requestAnimationFrame(animate);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
animate();

// Button interactions
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const label = btn.querySelector('.btn-label').textContent;
    console.log(`Button clicked: ${label}`);
  });
});
</script>
</body>
</html>
